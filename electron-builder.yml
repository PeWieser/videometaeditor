appId: com.videometaeditor.app
productName: Video Meta Editor
directories:
  output: dist
  buildResources: build
files:
  - "!src/**/*"
  - "!node_modules/**/*"
  - "!bin/**/*"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: VideoMetaEditor.exe