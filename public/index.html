<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Meta Editor</title>
  <style>
    /* Deaktiviert die Textauswahl global für Listen, Buttons und Überschriften */
    body {
      user-select: none;
      -webkit-user-select: none;
    }
    /* Eingabefelder müssen zwingend markierbar bleiben! */
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
